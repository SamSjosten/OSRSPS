org.gradle.configuration-cache=true
org.gradle.parallel=true
kotlin.code.style=official
# The test sources outgrew the default heaps: compileTestKotlin ran out of memory on a CI runner (GC overhead limit)
# and in cloud sessions. The image build (Dockerfile) sets its own small heaps and compiles in-process, so these
# don't reach 214.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g
kotlin.daemon.jvmargs=-Xmx3g
