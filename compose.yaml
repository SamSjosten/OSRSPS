# Runs the server on the sandbox VM and keeps it up across crashes and reboots.
#   docker compose up -d --build     start (or rebuild after a git pull)
#   deploy/auto-deploy.sh            pull main and rebuild if main moved (osrsps-deploy.timer runs it every minute)
#   docker compose logs -f           follow the log
#   docker compose run --rm osrsps fetch-cache    download the cache into ./data
services:
  osrsps:
    build: .
    restart: unless-stopped
    # The image build for the next deploy runs next to this container on a VM that can be ballooned down to 2 GB. If
    # memory runs out anyway, the kernel kills something else first (the build fails and the deploy is retried with the
    # next commit) rather than the live server.
    oom_score_adj: -500
    ports:
      - "43594:43594"
      - "43595:43595"
    environment:
      # The heap the server had by default when VM 214 was at 2 GB, fixed so it can't grow while the VM shrinks.
      JAVA_OPTS: -Xmx512m
      # The address RuneLite reaches us on: the Proxmox host forwards both ports to this VM.
      # Only a fallback since the client files answer with whatever host the client asked by (odinsgate.net or this).
      OSRSPS_PUBLIC_HOST: 192.168.0.210
      # The VPS relay's address on the LAN: every internet player's connection arrives from it. Only it may send a PROXY
      # header naming the player's own address; a connection from it without one is exempt from the
      # 10-connections-per-address limit. Logins are also limited by name (5 wrong passwords lock a name 5 minutes).
      OSRSPS_RELAYS: 192.168.0.216
      # Whether the relay's connections must start with a PROXY header: optional (with or without one), required or off.
      OSRSPS_PROXY_PROTOCOL: optional
      # Uncomment to make every random roll repeat from startup; unset, a new seed is picked and logged.
      # OSRSPS_SEED: "1234"
      # Names, comma separated, who may run the world-changing commands (::pause, ::npc, ::addloc...); unset, everyone
      # may. Sam's main account and the test runner's accounts, whose passwords are kept private (not the runner's
      # default "test"), since an admin's password is all that guards these commands.
      OSRSPS_ADMINS: "Swaggy,test,test2"
      # The commit served at http://<host>:43595/version. deploy/auto-deploy.sh sets it; a plain `docker compose up`
      # leaves it "unknown".
      OSRSPS_COMMIT: ${OSRSPS_COMMIT:-unknown}
    volumes:
      - ./data:/data
