# Runs the server on the sandbox VM and keeps it up across crashes and reboots.
#   docker compose up -d --build     start (or rebuild after a git pull)
#   docker compose logs -f           follow the log
#   docker compose run --rm osrsps fetch-cache    download the cache into ./data
services:
  osrsps:
    build: .
    restart: unless-stopped
    ports:
      - "43594:43594"
      - "43595:43595"
    environment:
      # The address RuneLite reaches us on: the Proxmox host forwards both ports to this VM.
      OSRSPS_PUBLIC_HOST: 192.168.0.210
      # Uncomment to make every random roll repeat from startup; unset, a new seed is picked and logged.
      # OSRSPS_SEED: "1234"
    volumes:
      - ./data:/data
