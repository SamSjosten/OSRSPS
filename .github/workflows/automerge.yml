name: automerge

# The `codex-review` check that branch protection requires on main, and the queue that merges main into the pull
# requests with auto-merge on: several at once on the automerge/batch branch when more than one is ready, else one at a
# time (.github/scripts/automerge.js, CONTRIBUTING.md). The queue pushes the batch branch with this workflow's token,
# from the checkout of main below. With no merge rules on main (a private repository without GitHub Pro), the queue
# also merges: a pull request labelled `automerge`, up to date and green, by moving main with this workflow's token.
#
# Its jobs run on the self-hosted runner VM only once the repository is private: a pull_request_target workflow on a
# public repository runs for anyone's pull request (CONTRIBUTING.md, "Where CI runs").
#
# pull_request_target and issue_comment run main's copy of this file with a token that can write, so it checks out
# main only and never runs a pull request's code; the pull request's commits are fetched for `git merge-tree` and
# nothing else. No pull_request_review trigger: that runs the pull request's own copy, and its jobs land on the pull
# request's head as checks of their own. The queue looks again at every waiting `codex-review` instead.
on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, auto_merge_enabled, labeled]
  # Codex edits its summary comment when a review finishes.
  issue_comment:
    types: [created, edited]
  # Every workflow whose checks land on a pull request's head: merging by itself, the queue waits for all of them, and
  # nothing else wakes it when the last one to finish isn't build.
  workflow_run:
    workflows: [build, mergeable, pin-health, release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The job names are what automerge.js leaves out of a pull request's checks: GitHub files a pull_request_target run's
  # jobs on the pull request's head, so the queue would otherwise wait on its own run.
  automerge-gate:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       github.event.comment.user.login == 'chatgpt-codex-connector[bot]')
    runs-on: ${{ github.repository == 'SamSjosten/OSRSPS' && github.event.repository.private && fromJSON('["self-hosted", "linux"]') || 'ubuntu-latest' }}
    permissions:
      actions: write
      checks: write
      contents: write
      issues: write
      pull-requests: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/github-script@v7
        with:
          script: |
            await require('./.github/scripts/automerge.js').gate({ github, context, core });

  automerge-queue:
    needs: automerge-gate
    if: >-
      always() &&
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request && github.event.comment.user.login == 'chatgpt-codex-connector[bot]'))
    runs-on: ${{ github.repository == 'SamSjosten/OSRSPS' && github.event.repository.private && fromJSON('["self-hosted", "linux"]') || 'ubuntu-latest' }}
    permissions:
      actions: write
      checks: write
      contents: write
      issues: write
      pull-requests: write
    timeout-minutes: 15
    # No concurrency group: GitHub cancels a group's pending run when a newer one queues, and these jobs sit on pull
    # requests' heads, where a cancelled run shows as a failed check. Two queue runs at once can each merge main into
    # a pull request, which costs a build but nothing else: the ruleset still wants a pull request up to date with main
    # before it merges (merging by itself, the queue moves main only as a fast-forward of the main it checked), and the
    # queue goes round again after each merge.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/github-script@v7
        with:
          script: |
            await require('./.github/scripts/automerge.js').queue({ github, context, core });
