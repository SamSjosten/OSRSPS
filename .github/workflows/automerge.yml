name: automerge

# The `codex-review` check that branch protection requires on main, and the queue that merges main into the next pull
# request with auto-merge on, one at a time (.github/scripts/automerge.js, CONTRIBUTING.md).
#
# pull_request_target and issue_comment run main's copy of this file with a token that can write, so it checks out
# main only and never runs a pull request's code; the pull request's commits are fetched for `git patch-id` and
# nothing else. No pull_request_review trigger: that runs the pull request's own copy, and its jobs land on the pull
# request's head as checks of their own. The queue looks again at every waiting `codex-review` instead.
on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, auto_merge_enabled]
  # Codex edits its summary comment when a review finishes.
  issue_comment:
    types: [created, edited]
  workflow_run:
    workflows: [build]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  checks: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  gate:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       github.event.comment.user.login == 'chatgpt-codex-connector[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: automerge-gate-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/github-script@v7
        with:
          script: |
            await require('./.github/scripts/automerge.js').gate({ github, context, core });

  queue:
    needs: gate
    if: >-
      always() &&
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request && github.event.comment.user.login == 'chatgpt-codex-connector[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One queue at a time; a newer pending run replaces an older one, which is fine as each looks at every pull request.
    concurrency:
      group: automerge-queue
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/github-script@v7
        with:
          script: |
            await require('./.github/scripts/automerge.js').queue({ github, context, core });
