name: build

on:
  push:
    branches: [master, main]
  pull_request:
  # automerge.yml starts this on a pull request's branch after merging main into it: GitHub runs no workflow for a
  # push made with a workflow's own token.
  workflow_dispatch:

# The jobs' names are the checks the ruleset on main requires: a job split up keeps its name on a job that waits for
# the parts (`build`), and a job that sits a change out is skipped, which counts as passing. A skipped matrix job
# shows under the job's bare name instead of each matrix name.
#
# Where the server's Linux jobs run (also probe.yml; CONTRIBUTING.md, "Where CI runs"): on the self-hosted runner VM
# (labels self-hosted and linux) once the repository is private, as a private repository's hosted minutes run out in
# days. While it is public, only main's code goes there, and only with the repository variable RUNNER set to
# self-hosted: a push to main, or a dispatch or schedule on main. Pull requests and the queue's builds of their
# branches stay on GitHub's ubuntu-latest, so no fork's code reaches the VM. (The launcher and its jobs moved to the
# public repository OdinsGate with launcher 1.0.2.)
permissions:
  contents: read

jobs:
  # Which parts of the repository the change touches, against main (the pull request's base): tick-recorder and
  # test-runner sit out a change that touches nothing they build from. A run on main runs everything, so main's
  # artifacts and Gradle caches are always whole.
  changes:
    runs-on: ${{ github.repository == 'SamSjosten/OSRSPS' && (github.event.repository.private || vars.RUNNER == 'self-hosted' && github.ref == 'refs/heads/main' && contains(fromJSON('["push", "workflow_dispatch", "schedule"]'), github.event_name)) && fromJSON('["self-hosted", "linux"]') || 'ubuntu-latest' }}
    outputs:
      tick-recorder: ${{ steps.paths.outputs.tick-recorder }}
      test-runner: ${{ steps.paths.outputs.test-runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        env:
          BASE: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          # A run on main itself (a push, or the dispatch after the queue merges with its own token) builds everything.
          if [[ $GITHUB_EVENT_NAME == push || $GITHUB_REF == refs/heads/main ]]; then
            printf '%s\n' tick-recorder=true test-runner=true | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "origin/$BASE...HEAD")
          printf '%s\n' "$changed"
          shared='^(gradle/|gradlew|\.github/workflows/build\.yml$)'
          touches() { if grep -qE "$1|$shared" <<<"$changed"; then echo true; else echo false; fi; }
          {
            echo "tick-recorder=$(touches '^tick-recorder/')"
            echo "test-runner=$(touches '^test-runner/')"
          } | tee -a "$GITHUB_OUTPUT"

  # The server's tests in five parts at once (build.gradle.kts, -PtestShard), each with the whole build around them.
  server-tests:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    runs-on: ${{ github.repository == 'SamSjosten/OSRSPS' && (github.event.repository.private || vars.RUNNER == 'self-hosted' && github.ref == 'refs/heads/main' && contains(fromJSON('["push", "workflow_dispatch", "schedule"]'), github.event_name)) && fromJSON('["self-hosted", "linux"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      # On the CI VM (12 vCPU) a part runs its test classes in 3 JVMs at once: with one, a part used about a third of
      # the VM's CPU and the five parts ran one after another. GitHub's 4-vCPU machines keep one.
      - run: ./gradlew build --build-cache -PtestShard=${{ matrix.shard }}/5 -PtestForks=${{ runner.environment == 'self-hosted' && 3 || 1 }}

  # The server's build and every one of its tests: passes when each part above did. Also fails when `changes` did,
  # since the jobs that wait on it would be skipped, and a skipped job counts as passing.
  build:
    needs: [changes, server-tests]
    if: always()
    runs-on: ${{ github.repository == 'SamSjosten/OSRSPS' && (github.event.repository.private || vars.RUNNER == 'self-hosted' && github.ref == 'refs/heads/main' && contains(fromJSON('["push", "workflow_dispatch", "schedule"]'), github.event_name)) && fromJSON('["self-hosted", "linux"]') || 'ubuntu-latest' }}
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          TESTS: ${{ needs.server-tests.result }}
        run: |
          echo "changes: $CHANGES, server-tests: $TESTS"
          [[ $CHANGES == success && $TESTS == success ]]

  # The server VM's scripts: the deploy of main and the staging server, each played through on a made-up origin with a
  # stand-in for docker.
  deploy-script:
    runs-on: ${{ github.repository == 'SamSjosten/OSRSPS' && (github.event.repository.private || vars.RUNNER == 'self-hosted' && github.ref == 'refs/heads/main' && contains(fromJSON('["push", "workflow_dispatch", "schedule"]'), github.event_name)) && fromJSON('["self-hosted", "linux"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - run: deploy/auto-deploy-test.sh
      - run: deploy/staging-test.sh

  # The workflow scripts (.github/scripts): the merge conflict check (mergeable.yml) and the alert issues
  # (probe.yml) against a stand-in for GitHub's API, the odinsgate probe against a status page and a game port on
  # loopback, and the friend page checks on made-up pages and the real docs/.
  mergeable-script:
    runs-on: ${{ github.repository == 'SamSjosten/OSRSPS' && (github.event.repository.private || vars.RUNNER == 'self-hosted' && github.ref == 'refs/heads/main' && contains(fromJSON('["push", "workflow_dispatch", "schedule"]'), github.event_name)) && fromJSON('["self-hosted", "linux"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - run: node --test .github/scripts/*.test.js

  # The old friend download page (docs/, GitHub Pages): every page forwards to its namesake on OdinsGate's page, where
  # the launcher moved, and carries no banned word (.github/scripts/friend-page.js).
  friend-page:
    runs-on: ${{ github.repository == 'SamSjosten/OSRSPS' && (github.event.repository.private || vars.RUNNER == 'self-hosted' && github.ref == 'refs/heads/main' && contains(fromJSON('["push", "workflow_dispatch", "schedule"]'), github.event_name)) && fromJSON('["self-hosted", "linux"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - run: node .github/scripts/friend-page.js

  # The VM's launch and fetch scripts: the parts that need no VM or network, run with PowerShell 7 on Linux.
  launch-scripts:
    runs-on: ${{ github.repository == 'SamSjosten/OSRSPS' && (github.event.repository.private || vars.RUNNER == 'self-hosted' && github.ref == 'refs/heads/main' && contains(fromJSON('["push", "workflow_dispatch", "schedule"]'), github.event_name)) && fromJSON('["self-hosted", "linux"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - run: pwsh -NoProfile -File test-runner/launch/start-client-functions.tests.ps1
      - run: pwsh -NoProfile -File test-runner/launch/repo-fetch-functions.tests.ps1

  tick-recorder:
    needs: changes
    if: needs.changes.outputs.tick-recorder == 'true'
    runs-on: ${{ github.repository == 'SamSjosten/OSRSPS' && (github.event.repository.private || vars.RUNNER == 'self-hosted' && github.ref == 'refs/heads/main' && contains(fromJSON('["push", "workflow_dispatch", "schedule"]'), github.event_name)) && fromJSON('["self-hosted", "linux"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - run: ./gradlew -p tick-recorder build --build-cache
      - uses: actions/upload-artifact@v4
        with:
          name: tick-recorder-jar
          path: tick-recorder/build/libs/*.jar
          if-no-files-found: error

  test-runner:
    needs: changes
    if: needs.changes.outputs.test-runner == 'true'
    runs-on: ${{ github.repository == 'SamSjosten/OSRSPS' && (github.event.repository.private || vars.RUNNER == 'self-hosted' && github.ref == 'refs/heads/main' && contains(fromJSON('["push", "workflow_dispatch", "schedule"]'), github.event_name)) && fromJSON('["self-hosted", "linux"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - run: ./gradlew -p test-runner build --build-cache
      - uses: actions/upload-artifact@v4
        with:
          name: test-runner-jar
          path: test-runner/build/libs/*.jar
          if-no-files-found: error
