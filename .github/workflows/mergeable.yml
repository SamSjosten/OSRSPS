name: mergeable

# Flags open pull requests that stop merging cleanly into main: label, failing `mergeable` check and a comment for the
# thread that opened them (.github/scripts/mergeable.js, CONTRIBUTING.md).
#
# pull_request_target and not pull_request: GitHub runs no pull_request workflow for a pull request that conflicts,
# which is the one case this is for. It runs main's copy of this file with a token that can write, so it checks out
# main only and never runs the pull request's code.
on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mergeable-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  scan:
    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: write
    runs-on: ${{ github.repository == 'SamSjosten/OSRSPS' && github.event.repository.private && fromJSON('["self-hosted", "linux"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        with:
          script: |
            await require('./.github/scripts/mergeable.js')({ github, context, core });
